# ===========================================================================
# kitty/hyprland-overrides.conf — Hyprland-specific overrides
#
# Pulled in by kitty.conf (`globinclude hyprland-*.conf`), so it applies on
# every host where the file exists. Hyprland handles window transparency and
# blur in the compositor, so Kitty's own values are reset:
#   background_opacity  1.0 = opaque (kitty.conf sets 0.85)
#   background_blur     0   = no kitty-side blur (kitty.conf sets 20)
# ===========================================================================

background_opacity  1.0
background_blur     0
