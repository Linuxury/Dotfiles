# ===========================================================================
# kitty.conf — Kitty terminal configuration (kitty 0.51.0 option names)
#
# Seeded once from the repo into ~/.config/kitty by home.activation.kittyConfSeed
# (modules/users/linuxury/home/default.nix); it is a plain file, not a Nix-managed
# symlink. Noctalia patches it in place: on a wallpaper change it injects an
# `include themes/noctalia.conf` line and signals kitty to reload. Edits made on
# the machine stay there. To re-seed from the repo version, delete the file and
# rebuild.
# ===========================================================================

# Overrides loaded only where a matching file exists (kitty/hyprland-overrides.conf
# is the Hyprland one). globinclude takes a glob relative to this file; no match
# is not an error. `include` (single file, must exist) and `envinclude` (by
# environment variable) are the other include forms.
globinclude hyprland-*.conf

# Theme colours written by matugen (COSMIC hosts) or Noctalia (Hyprland/Umbriel
# hosts); absent on hosts where the other tool owns kitty theming.
globinclude colors.conf

# env NAME=VALUE: set an environment variable in every program kitty starts.
#   FORCE_COLOR=3     force 24-bit truecolor in Node.js CLIs
#   TERM_PROGRAM      name of the terminal program, read by shell/CLI tools
env FORCE_COLOR=3
env TERM_PROGRAM=kitty

# ---------------------------------------------------------------------------
# Font
#   font_family       family name (`kitten choose-fonts` lists/previews them)
#   bold_font, italic_font, bold_italic_font
#                     `auto` derives the style from font_family; or name a font
#   font_size         size in pt (default 11.0)
#   disable_ligatures never (always render), cursor (off under the cursor),
#                     always (never render)
# ---------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

disable_ligatures never

# ---------------------------------------------------------------------------
# Window appearance
#   background_opacity   0 (transparent) to 1 (opaque), default 1.0
#   background_blur      > 0 blurs what is behind the window (needs opacity < 1;
#                        Wayland with the compositor's blur protocol, or macOS)
#   window_padding_width pt of blank space: 1 value = all sides, 2 = vertical
#                        then horizontal, 3 = top/horizontal/bottom, 4 = top/
#                        right/bottom/left
#   resize_in_steps      yes resizes the OS window in whole cell steps (no on
#                        Wayland), no resizes by pixel
# ---------------------------------------------------------------------------
background_opacity  0.85
background_blur     20

window_padding_width 10 14

resize_in_steps no

# ---------------------------------------------------------------------------
# Cursor
#   cursor_shape                 block, beam or underline (programs may override)
#   cursor_beam_thickness        beam width in pt (default 1.5)
#   cursor_blink_interval        seconds; 0 disables, negative = system default;
#                                an easing function may follow (`0.5 ease-in-out`)
#   cursor_stop_blinking_after   seconds idle before blinking stops; 0 = never stop
#   cursor_trail                 ms the cursor must rest before a trail animation
#                                follows its next jump; 0 disables the trail
#   cursor_trail_decay           fastest and slowest decay time in seconds
#   cursor_trail_start_threshold cells moved (one value, or x then y) before a
#                                trail starts
# ---------------------------------------------------------------------------
cursor_shape                    beam
cursor_beam_thickness           1.8
cursor_blink_interval           0.5
cursor_stop_blinking_after      0.0
cursor_trail                    1
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    2

# ---------------------------------------------------------------------------
# Scrollback
#   scrollback_lines   lines of history kept in memory (default 2000); negative
#                      = effectively infinite
# ---------------------------------------------------------------------------
scrollback_lines 10000

# ---------------------------------------------------------------------------
# URL handling
#   url_style      underline style of a hovered URL: none, straight, double,
#                  curly, dotted, dashed
#   open_url_with  program that opens a clicked URL; `default` uses
#                  open_actions handlers, then xdg-open
#   detect_urls    yes highlights plain-text URLs under the mouse
# ---------------------------------------------------------------------------
url_style     curly
open_url_with default
detect_urls   yes

# ---------------------------------------------------------------------------
# Tab bar
#   tab_bar_edge            top, bottom, left or right
#   tab_bar_style           fade, slant, separator, powerline, custom (tab_bar.py),
#                           hidden
#   tab_powerline_style     angled, slanted or round (powerline style only)
#   tab_bar_min_tabs        tabs needed before the bar shows (default 2)
#   tab_title_template      per-tab title; fields include {index}, {title},
#                           {layout_name}, {num_windows}
#   active_tab_font_style, inactive_tab_font_style
#                           bold, italic, bold-italic or normal
# ---------------------------------------------------------------------------
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      " {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ---------------------------------------------------------------------------
# Bell
#   enable_audio_bell     yes/no, the audible bell
#   visual_bell_duration  seconds the screen flashes on a bell; 0 disables
# ---------------------------------------------------------------------------
enable_audio_bell     no
visual_bell_duration  0.1

# ---------------------------------------------------------------------------
# Performance
#   repaint_delay            ms between screen updates (default 10, about 100 FPS)
#   input_delay              ms to wait before processing program output
#                            (default 3)
#   sync_to_monitor          yes ties updates to the monitor refresh rate
#                            (prevents tearing); no lowers latency
#   confirm_os_window_close  ask before closing an OS window or tab holding at
#                            least this many kitty windows; 0 never asks,
#                            negative ignores windows idle at a shell prompt
# ---------------------------------------------------------------------------
repaint_delay 10
input_delay   3
sync_to_monitor yes
confirm_os_window_close 0


# ---------------------------------------------------------------------------
# Key bindings — `map <keys> <action>`; ctrl+shift is kitty's default modifier
# ---------------------------------------------------------------------------

# Tabs
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+w       close_tab
map ctrl+shift+]       next_tab
map ctrl+shift+[       previous_tab
map ctrl+shift+alt+t   set_tab_title

# Windows (kitty windows inside a tab) and OS windows
map ctrl+shift+enter   new_window_with_cwd
map ctrl+shift+n       new_os_window_with_cwd
map ctrl+shift+q       close_window
map ctrl+shift+h       neighboring_window left
map ctrl+shift+l       neighboring_window right
map ctrl+shift+k       neighboring_window up
map ctrl+shift+j       neighboring_window down

# Font size: change_font_size <all|current> <+n|-n|n>; 0 restores the configured size
map ctrl+shift+equal   change_font_size all +1.0
map ctrl+shift+minus   change_font_size all -1.0
map ctrl+shift+0       change_font_size all 0

# Clipboard
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard

# Scrollback: open history in the pager / the last command's output
map ctrl+shift+f       show_scrollback
map ctrl+shift+g       show_last_command_output
