# topgrade-nixos.toml — Topgrade settings for NixOS hosts (topgrade 17.15.0).
# Topgrade runs one update step per package manager; this file turns off the
# steps Nix already owns and adds the config pull + rebuild as custom commands.
# Reference for every key: `topgrade --config-reference`.

# [misc]
#   pre_sudo   run `sudo -v` first so a password prompt does not interrupt an
#              unattended run (default false)
#   no_retry   same as ask_retry = false: a failed step is not offered again
#              (default false); auto_retry = N retries automatically
#   disable    steps to skip, same names as `--disable` (e.g. "system", "emacs")
#   Not set here: cleanup (remove temporary/old files), sudo_loop, sudo_command,
#   tmux_session_mode, allow_root
[misc]
pre_sudo = true
no_retry = true
disable = [
  # Replaced by the [commands] below, so the system is not rebuilt twice.
  "system",
  "nix",
  "home_manager",
  # Helix grammars are prebuilt in the read-only Nix store, so `hx --grammar
  # fetch` always fails; nixpkgs updates them.
  "helix",
  # Nix-managed: a self-update would write to the read-only Nix store. Update
  # through nru instead.
  "claude_code",
  "poetry",
  # Handled by nru (_nru_flatpak_bar) and the weekly flatpak-auto-update
  # systemd timer, which tolerate remotes that no longer resolve; topgrade's
  # own flatpak step would report those as errors.
  "flatpak",
]

# [commands] — custom steps, `"<name>" = "<shell command>"`, run in order.
# Related tables: [pre_commands] (before every step), [post_commands] (after).
# A leading `-i` runs the command in an interactive shell.
[commands]
# `git pull --ff-only` fails instead of merging when the local branch has
# diverged, so local work is never overwritten.
"NixOS config (git pull)" = "git -C ~/nixos-config pull --ff-only"
"NixOS rebuild"           = "sudo nixos-rebuild switch --flake ~/nixos-config"
