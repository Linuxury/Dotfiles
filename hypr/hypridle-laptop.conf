# ===========================================================================
# hypridle-laptop.conf — idle profile for laptop hosts
#
# Timeline:
#   2 min   dim the backlight (restored on activity)
#   5 min   display off (DPMS, back on with activity)
#   7 min   lock (loginctl lock-session → lock_cmd → Noctalia lock screen)
#   15 min  suspend
#
# hypridle (0.1.8) runs idle actions on the ext-idle-notify-v1 protocol.
# It reads ~/.config/hypr/hypridle.conf, which nixos-config links to this
# file or the other profile (hypridle-laptop.conf / hypridle-desktop.conf)
# per host. Started from modules/autostart.lua.
#
# general — options:
#   lock_cmd / unlock_cmd          run on `loginctl lock-session` /
#                                  `unlock-session` (D-Bus)
#   before_sleep_cmd               run before systemd suspend
#   after_sleep_cmd                run after resume
#   on_lock_cmd / on_unlock_cmd    run when the compositor reports the
#                                  session locked/unlocked
#   ignore_dbus_inhibit            ignore D-Bus idle inhibitors (browsers,
#                                  Steam); default false
#   ignore_systemd_inhibit         ignore `systemd-inhibit --what=idle`
#   ignore_wayland_inhibit         ignore Wayland idle-inhibit (window rules)
#   inhibit_sleep                  hold suspend until before_sleep_cmd is done:
#                                  0 off, 1 on, 2 auto (default), 3 wait until
#                                  the screen is locked
# listener — one block per idle step:
#   timeout          seconds idle before on-timeout runs
#   on-timeout       command to run; empty = nothing
#   on-resume        command run on activity after the timeout fired
#   ignore_inhibit   fire even while idle is inhibited
#   condition_cmd    run first; exit 0 = go ahead, non-zero = skip
#   condition_retry  seconds before retrying a skipped condition (0 = never)
# ===========================================================================

general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = loginctl lock-session                  # Lock before systemd suspend
    after_sleep_cmd = ~/.config/hypr/scripts/compositor-dpms.sh on   # Wake screen after resume
}

# Dim after 2 minutes idle; scripts/dim-screen.sh saves the current level
# and restore-brightness.sh puts it back. Both do nothing without a backlight.
listener {
    timeout = 120
    on-timeout = ~/.config/hypr/scripts/dim-screen.sh
    on-resume = ~/.config/hypr/scripts/restore-brightness.sh
}

# Display off after 5 minutes idle, on again with activity (Noctalia DPMS)
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/compositor-dpms.sh off
    on-resume = ~/.config/hypr/scripts/compositor-dpms.sh on
}

# Lock after 7 minutes idle
listener {
    timeout = 420
    on-timeout = loginctl lock-session
}

# Suspend after 15 minutes idle
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
