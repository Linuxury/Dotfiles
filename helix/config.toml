# Helix — linked to ~/.config/helix/config.toml by nixos-config
# modules/development/editors/helix.nix. themes/noctalia.toml is written by
# Noctalia, not tracked here.
theme = "noctalia"

[editor]
line-number = "relative"
cursorline = true          # highlights the line the cursor is on
bufferline = "multiple"    # tab bar when more than one file is open
color-modes = true         # colours the NOR/INS/SEL label by mode

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.soft-wrap]
enable = true
