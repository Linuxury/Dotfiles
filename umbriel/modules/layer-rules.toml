# Layer rules — effects for layer-shell surfaces (bars, launchers,
# notifications, widgets). Included from ../config.toml. Run `umbriel layers`
# to list live namespaces. Docs: docs/user/layer-rules.md.
#   match.namespace    regex (or array) on the surface namespace
#   match.layer        background, bottom, top or overlay
#   match.at_startup   true: only during the first 60 seconds; false: after
#   blur               blur behind the surface (needs [appearance.blur])
#   blur_popups        also blur its XDG popups
#   blur_ignore_alpha  skip blur where alpha is below this, 0.0-1.0
#   blur_optimized     override the global optimized-blur choice; false gives
#                      exact per-surface blur
#   dim_behind         (0.0) darken content below this layer, 0.0-1.0
#
# Blur Noctalia's bar, notifications, dock, panels, OSD and desktop widgets.
# Same rule as upstream's packaged example.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false
