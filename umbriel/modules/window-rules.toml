# Window rules — per-application placement, size, decoration and effects.
# Included from ../config.toml. Docs: docs/user/window-rules.md; option list:
# `umbriel config schema` (window_rule[]). Run `umbriel windows` (or
# `umbriel focused-window`) to read live app IDs, titles, tags and content
# types.
#
# Every matching rule contributes; when two set the same key, the later rule
# wins. Selectors are optional (none = every window). Regexes match any part
# of the value, so anchor with ^ and $; app_id, title and xdg_tag also take
# an array of patterns (any one matching).
#   Selectors   match.app_id, match.title, match.xdg_tag, match.content_type
#               (none, photo, video, game), match.layout (scrolling, dwindle,
#               master, stacking), match.is_focused, is_floating, is_pinned,
#               is_dialog, is_scratchpad, is_maximized_to_edges, is_alone
#               (alone in the tiled layout), is_only_window (floating
#               included), is_cast_target, at_startup (first 60 s)
#   On open     default_workspace (index or name), default_output,
#               default_floating, default_floating_size {width, height}
#               (fractions 0.1-1.0), default_floating_size_px {width,
#               height}, default_position {x, y, anchor: top_left,
#               top_right, bottom_left, bottom_right, top, bottom, left,
#               right, center}, default_focused, default_pinned,
#               default_fullscreen, default_maximize,
#               default_maximize_to_edges, default_scratchpad,
#               default_scrolling_column (+ _order), default_scrolling_extent
#               (0.1-4.0) / _extent_px, default_column_display
#               (normal/tabbed), attach_to_parent
#   While open  opacity, blur, blur_optimized, blur_popups,
#               blur_ignore_alpha, dim_behind, shadow, border_width,
#               outer_border_width, corner_radius, border_color_focused /
#               unfocused / outer, border_effect, window_effect, title_bar
#               (on/negotiated/forced/off), title_bar_buttons, vrr
#               (disabled/always/fullscreen), tearing, hdr (off/on/auto/
#               fullscreen), focus_on_activate, confine_pointer,
#               allow_shortcuts_inhibit, background_render, block_capture,
#               touchpad_scroll_factor
# The blur-all, Noctalia, PiP and Steam-toast rules come from upstream's
# packaged example; the rest are local.

# Blur every window. Keep this selectorless rule first so later matching
# rules can override individual blur settings.
[[window_rule]]
blur = true
blur_optimized = false

# A lone tiled column takes 0.75 of the viewport; the effect is removed when
# a second column appears (back to layout.scrolling.default_extent_fraction)
# and restored when the column is alone again.
[[window_rule]]
match.is_alone = true
default_scrolling_extent = 0.75

# Steam client -> workspace 3, games -> workspace 2 (same split as
# dotfiles/hypr/modules/windowrules.lua). Steam runs under Xwayland and
# reports app_id "steam"; Proton/Steam games report "steam_app_<appid>" via
# Xwayland, or the "proton-game" XDG toplevel tag when native Wayland.
[[window_rule]]
match.app_id = "^steam$"
default_workspace = 3

# Steam's windows all share app_id "steam", so they are told apart by title
# and given fixed floating positions and pixel sizes (Umbriel does not
# remember a window's last position). Chat windows are titled with the
# contact's name, so they cannot be matched and open at the default spot.
[[window_rule]]
match.app_id = "^steam$"
match.title = "^Steam$"
default_position = { x = 0, y = 0, anchor = "center" }
default_floating_size_px = { width = 2114, height = 1236 }

[[window_rule]]
match.app_id = "^steam$"
match.title = "^Steam Settings$"
default_position = { x = 1295, y = 314, anchor = "top_left" }
default_floating_size_px = { width = 850, height = 722 }

[[window_rule]]
match.app_id = "^steam$"
match.title = "^Friends List$"
default_position = { x = 3146, y = 461, anchor = "top_left" }
default_floating_size_px = { width = 285, height = 659 }

[[window_rule]]
match.app_id = "^steam_app_.*$"
default_workspace = 2

[[window_rule]]
match.xdg_tag = "^proton-game$"
default_workspace = 2

# Minecraft (PrismLauncher) -> workspace 2, same as other games. LWJGL/GLFW
# reports the window class as "Minecraft* <version>" (literal asterisk) via
# Xwayland; the pattern matches the "Minecraft*" prefix, so it covers every
# version (single-quoted TOML literal, so the regex gets \* as-is).
[[window_rule]]
match.app_id = '^Minecraft\*.*$'
default_workspace = 2

# Noctalia settings
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# Noctalia share picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Update terminal of the nixos-updates Noctalia plugin (`kitty --class
# nixos-updates -e`); the nix-updates spelling is matched too so either
# class floats.
[[window_rule]]
match.app_id = "^(nixos-updates|nix-updates)$"
default_floating = true
default_floating_size_px = { width = 1100, height = 750 }

# Picture-in-picture: browsers expose no PiP role or position control, so
# match the title and float it in the bottom-right corner.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Keep Steam notification toasts in the bottom-right corner without
# stealing focus, and pin them so workspace switches do not hide them.
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ─────────────── Upstream's example recipes (commented) ──────────────────
# default_size, default_width and default_height below are not in the
# installed schema; use default_floating_size_px / default_floating_size
# (fractions) or default_scrolling_extent(_px) instead.
#
# Optional placement recipe. Output names follow the same rules as [output.*].

# [[window_rule]]
# match.app_id = "^org[.]example[.]Chat$"
# default_output = "LG Electronics LG ULTRAGEAR+ 410NTDVAJ338"
# default_workspace = 2
# default_focused = false

# Open an application maximized while keeping its parented dialogs natural-sized.

# [[window_rule]]
# match.app_id = "^example-app$"
# default_maximize = true

# Open an application maximized to usable-area edges, without gaps or borders.

# [[window_rule]]
# match.app_id = "^discord$"
# default_maximize_to_edges = true

# Match a standardized surface content hint.

# [[window_rule]]
# match.content_type = "game"
# vrr = "always"

# Match a client-defined XDG toplevel tag, such as Proton-EM's game tag.

# [[window_rule]]
# match.xdg_tag = "^proton-game$"
# default_fullscreen = true

# Seed a new horizontal scrolling column with a pixel width. The layout
# controls its tiled height, and existing named columns keep their
# established width.

# [[window_rule]]
# match.app_id = "^org[.]example[.]Wide$"
# default_size = [1200, 600]

# Size a floating window as fractions of the usable area. `default_size`
# wins on both axes if it is also present.

# [[window_rule]]
# match.app_id = "^org[.]example[.]Utility$"
# default_floating = true
# default_width = 0.5
# default_height = 0.6

# Dynamic effects and output policies can be combined in one matching rule.

# [[window_rule]]
# match.app_id = "^firefox$"
# match.title = "^Library$"
# default_floating = true
# default_focused = false
# focus_on_activate = true
# opacity = 0.95
# blur_popups = true
# blur_ignore_alpha = 0.1
# vrr = "always"
# tearing = true
# hdr = "fullscreen"

# Keep related tiled windows in one named scrolling column. Lower orders
# appear higher in horizontal scrolling and farther left in vertical
# scrolling.

# [[window_rule]]
# match.app_id = "^firefox$"
# default_scrolling_column = "browsers"
# default_scrolling_column_order = 10

