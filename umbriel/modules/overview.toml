# Overview and hot corners — the all-workspaces overview and actions run when
# the pointer rests in an output corner. Included from ../config.toml.
# Docs: docs/user/workspaces-overview.md, docs/user/keybinds.md#hot-corners.

# [overview] — trailing comments describe each key; also, not set:
#   scroll_factor_horizontal / scroll_factor_vertical  (1.0, 0.1-10.0)
#                                     gesture and wheel sensitivity
[overview]
zoom = 0.5                                      # Workspace scale in overview, 0.1-0.75
# Pinned windows stay hidden until overview closes; visible scratchpads are dismissed.
# background_blur = true                        # Blur the wallpaper behind overview rows
# workspace_wallpaper = true                    # Mirror wallpapers inside workspace previews
# shortcuts = true                              # Show keyboard shortcut badges on windows
# shortcut_keys = "1234567890"                  # Badge keys in preference order

# Hot corners — one table per corner (top_left, top_right, bottom_left,
# bottom_right); every corner is disabled by default.
#   enabled   turn the corner on
#   delay_ms  rest time before firing, 0-10000; 0 fires immediately
#   action    any action from docs/user/actions.md, written as words
#             ("spawn <cmd...>", "overview-toggle")
# Corners are inactive while the output's focused window is fullscreen or an
# exclusive-keyboard layer (a launcher) is open. Only top_left is on here,
# matching upstream's packaged example.
[hot_corners.top_left]
enabled = true                                  # Open the overview after resting here
delay_ms = 500                                  # 0 activates immediately; maximum is 10000
action = "overview-open"                        # Any normal Umbriel action is accepted

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn notify-send 'Bottom right'"
