# Outputs and workspaces — per-monitor mode, scale, VRR, HDR and workspace
# inventory, plus global workspace behaviour and per-workspace layout rules.
# Included from ../config.toml. Run `umbriel outputs` for connector names,
# monitor identities ("<make> <model> <serial>", the `Config name` column) and
# modes. Docs: docs/user/outputs.md, docs/user/workspaces.md.
#
# [output."<connector or identity>"] keys (installed schema, default):
#   enabled            (true) false removes the output, keeping its state
#   mode               "WxH" or "WxH@Hz"
#   position           [x, y] logical top-left; omit for automatic placement
#   scale              0.25-4.0; logical size = mode / scale
#   transform          normal, 90, 180, 270, flipped, flipped-90/-180/-270
#   vrr                (disabled) always, fullscreen (active workspace has a
#                      fullscreen window) or fullscreen_any (any workspace)
#   tearing            (false) async page flips for eligible fullscreen windows
#   direct_scanout     (true) bypass composition for eligible fullscreen buffers
#   hdr                (off) on (always HDR), auto (fullscreen content with
#                      HDR metadata) or fullscreen (any fullscreen content)
#   sdr_white          (203) SDR reference white in cd/m2 while HDR, 80-1000
#   sdr_transfer       (gamma22) or srgb
#   color_profile      (none) edid or an ICC file path
#   sdr_gamut          (native) or srgb, while a color profile is active
#   bit_depth          (8) or 10, render depth for SDR output
#   focus_at_startup   (false) put the cursor on this output at startup
#   workspaces         (dynamic) a count 1-64 or a list of names
#   min_workspaces     (1) floor for a dynamic inventory, 1-64
#   cyclic_workspaces  (false) wrap workspace steps at the ends
#   workspace_axis     (vertical) or horizontal; also the scrolling-strip axis
#   screen_effect / screen_cast_effect  per-output effect preset/pool or "off"
#   layout.mode, layout.scrolling.default_extent_fraction  per-output layout
#
# Ryzen5900x's 34" LG ultrawide, named by monitor identity rather than
# connector (DP-3) so the section follows the monitor across ports; an
# identity section wins over a connector section. VRR is fullscreen-only.
# direct_scanout is off: leaving a fullscreen game swaps the scanout plane
# mid-flip, which freezes on "Atomic commit failed: busy". HDR is off; "auto"
# would switch to HDR only for fullscreen content carrying HDR metadata.
# Native Wayland Proton builds may need PROTON_ENABLE_WAYLAND=1 and
# DXVK_HDR=1 before a game publishes HDR metadata (outputs.md, HDR).
# sdr_white, bit_depth and color settings stay at their defaults.

[output."LG Electronics LG ULTRAGEAR+ 410NTDVAJ338"]
mode = "3440x1440@240"                        # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ
scale = 1.0                                   # Logical size is mode size divided by scale
vrr = "fullscreen"                                # disabled, always, or fullscreen
direct_scanout = false                        # False forces composition on this output
hdr = "off"                                 # off, on, auto, or fullscreen

# Upstream's generic example of the per-output keys, kept commented.

# [output.DP-1]
# enabled = true                                # False removes the output but preserves its state
# mode = "2560x1440@144"                        # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ
# position = [0, 0]                             # Logical top-left; omit for automatic placement
# scale = 1.25                                  # Logical size is mode size divided by scale
# transform = "normal"                          # normal, 90, 180, 270, or a flipped variant
# vrr = "fullscreen"                            # disabled, always, or fullscreen
# tearing = true                                # Permit eligible fullscreen asynchronous flips
# direct_scanout = true                         # False forces composition on this output
# hdr = "auto"                                  # off, on, auto, or fullscreen
# sdr_white = 203                               # SDR reference white in cd/m2 during HDR
# workspaces = 5                                # Omit for dynamic workspaces

# workspaces takes a count, a list such as ["WEB", "CHAT", "MEDIA"] for named
# static workspaces, or "dynamic" (the default). This output stays dynamic and
# keeps at least min_workspaces, so a bar always shows them; the key belongs
# to the LG output table above.
min_workspaces = 4                            # Dynamic floor; rejected with a static inventory

# New scrolling columns on this output can use a different initial width. This
# affects new columns only; existing columns keep their current size.
# [output."LG Electronics LG ULTRAGEAR+ 410NTDVAJ338".layout.scrolling]
# default_extent_fraction = 0.4

# [workspaces] — global workspace behaviour. Each output is dynamic unless
# its output section sets a static count or list of names.

[workspaces]
back_and_forth = false                          # Re-select active workspace to switch back
empty_above = false                             # Keep one empty workspace above active range

# [[workspace]] rules change layout for one workspace without creating it.
# Select exactly one of index (1-64) or name (must exist in a static
# inventory); output is optional. Any layout.* key from layout.toml can be
# set (mode, gap, extent_presets, struts, scrolling, dwindle, master,
# stacking, tabs, client_maximize, new_exits_fullscreen).
#
# Workspace 3 (Steam's home, see window-rules.toml) uses the free-floating
# stacking layout.
[[workspace]]
index = 3
layout.mode = "stacking"

# Example: workspace 2 as dwindle (works with dynamic inventories and static
# ones that contain workspace 2). Uncomment the complete block.

# [[workspace]]
# index = 2
# output = "LG Electronics LG ULTRAGEAR+ 410NTDVAJ338"
# layout.mode = "dwindle"
# layout.gap = 4
# layout.struts.top = 24
# layout.scrolling.center_underfull_strip = false
# layout.dwindle.preserve_split = true

# A name selector must exist in a static output inventory, for example
# `workspaces = ["WEB", "CHAT"]` in the matching output block.

# [[workspace]]
# name = "CHAT"
# output = "LG Electronics LG ULTRAGEAR+ 410NTDVAJ338"
# layout.mode = "master"
